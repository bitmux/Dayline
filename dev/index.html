<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day Spine card — dev harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  body{margin:0;padding:40px;background:#231f1b;font-family:"Figtree",system-ui,sans-serif;
       display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
  .col{display:flex;flex-direction:column;gap:10px;width:520px}
  .col.narrow{width:360px}
  .lbl{font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;
       color:rgba(232,220,198,.45)}
  day-spine-card{box-shadow:0 12px 32px rgba(0,0,0,.35);border-radius:28px}
</style>
</head>
<body>
<script type="module">
// Pin the clock to 2:39 PM so this harness reproduces the design reference exactly
// however late it is opened. Harness-only — the card itself reads the real clock.
// Installed before the bundle loads, hence the dynamic import.
const PINNED = (() => { const d = new Date(); d.setHours(14, 39, 0, 0); return d.getTime(); })();
Date.now = () => PINNED;

const { mock } = await import("./dev-bundle.js");

// A stand-in for the parts of `hass` the card touches. callService just logs, so
// the action button can be pressed here without a Home Assistant behind it.
function hass(attributes, { state = "3", unavailable = false } = {}) {
  return {
    locale: { language: "en-US" },
    states: unavailable ? {} : {
      "sensor.day_spine": {
        entity_id: "sensor.day_spine",
        state,
        last_updated: new Date().toISOString(),
        attributes,
      },
    },
    callService: (d, s, data, target) => {
      console.info("callService", `${d}.${s}`, { data, target });
      return Promise.resolve();
    },
  };
}

function mount(label, attributes, opts = {}, config = {}, narrow = false, style = "") {
  const col = document.createElement("div");
  col.className = "col" + (narrow ? " narrow" : "");
  col.setAttribute("style", style);
  col.innerHTML = `<div class="lbl">${label}</div>`;
  const card = document.createElement("day-spine-card");
  card.setConfig({ type: "custom:day-spine-card", entity: "sensor.day_spine", ...config });
  card.hass = hass(attributes, opts);
  col.appendChild(card);
  document.body.appendChild(col);
}

const SOURCES = [
  { label: "Google", color: "blue" },
  { label: "CalDAV", color: "teal" },
];

// Eight calendars is a real household, and what overflowed the old header.
// One of each colour, plus an uncoloured one, so the palette can be compared
// side by side and the fallback is visible in the same row.
const MANY_SOURCES = [
  ["Admin", "blue"], ["Wife", "teal"], ["Kid", "violet"], ["Family", "green"],
  ["School district", "cyan"], ["Soccer club", "rose"],
  ["Holidays in United States", "magenta"], ["House schedule", undefined],
].map(([label, color]) => ({ label, color, stale: label === "Soccer club" }));

mount("Mid-afternoon · the ordinary case", {
  entries: mock.ordinary,
  headline: "2 September · everyone home by 6",
  now: "Afternoon · house quiet, doors locked",
  sources: SOURCES,
});

// A frosted-glass theme: translucent card background plus a blur, both of which
// reach us only as ha-card custom properties. The gradient behind it is there so
// the blur has something to blur.
const FROSTED_THEME = `
  --card-background-color:rgba(40,36,48,0.55);
  --ha-card-background:rgba(40,36,48,0.55);
  --ha-card-backdrop-filter:blur(14px) saturate(140%);
  --ha-card-box-shadow:0 8px 32px rgba(0,0,0,0.37);
  --ha-card-border-width:1px;
  --ha-card-border-color:rgba(255,255,255,0.18);
  --ha-card-border-radius:20px;
  --primary-text-color:#f4f1fa;    --secondary-text-color:#b9b2c9;
  --divider-color:rgba(255,255,255,0.14);
  --disabled-text-color:rgba(255,255,255,0.3);
  --primary-color:#c68bff;         --accent-color:#8fd0a0;
  --text-primary-color:#1a1420;    --error-color:rgba(255,120,90,0.25);
  background:linear-gradient(135deg,#3a2a5e 0%,#7b4a6e 50%,#c4795a 100%);
  padding:16px; border-radius:24px;`;

mount(
  "Frosted glass theme · ha-card surface tokens honoured",
  {
    entries: mock.ordinary,
    headline: "3 September · 4 left today",
    now: "Afternoon · house quiet, doors locked",
    sources: SOURCES,
  },
  {},
  { use_ha_theme: true },
  false,
  FROSTED_THEME,
);

// The case that kills a pinned terracotta: a warm orange ground showing through
// translucent cards. A fixed accent here would put terracotta text on
// near-terracotta, so --ds-now has to be derived from the theme's own text
// colour rather than chosen in advance.
const ORANGE_GLASS = `
  --card-background-color:rgba(120,52,18,0.42);
  --ha-card-background:rgba(120,52,18,0.42);
  --ha-card-backdrop-filter:blur(14px) saturate(140%);
  --ha-card-box-shadow:0 8px 32px rgba(0,0,0,0.3);
  --ha-card-border-width:1px;
  --ha-card-border-color:rgba(255,255,255,0.2);
  --ha-card-border-radius:20px;
  --primary-text-color:#fff6ec;    --secondary-text-color:#e8cdb4;
  --divider-color:rgba(255,255,255,0.16);
  --disabled-text-color:rgba(255,255,255,0.32);
  --primary-color:#ffb066;         --accent-color:#ffd39b;
  --text-primary-color:#3a1d08;    --error-color:rgba(255,120,90,0.25);
  background:linear-gradient(135deg,#c2410c 0%,#ea7317 55%,#f59e0b 100%);
  padding:16px; border-radius:24px;`;

mount(
  "Orange glass theme · the now marker must survive a warm ground",
  {
    entries: mock.ordinary,
    headline: "4 September · 4 left today",
    now: "Afternoon · house quiet, doors locked",
    sources: SOURCES,
  },
  {},
  { use_ha_theme: true },
  false,
  ORANGE_GLASS,
);

// A light theme: the same derivation has to land dark rather than pale.
const LIGHT_THEME = `
  --card-background-color:#ffffff;  --ha-card-background:#ffffff;
  --ha-card-box-shadow:0 2px 8px rgba(0,0,0,0.12);
  --ha-card-border-radius:16px;
  --primary-text-color:#1c1b1f;     --secondary-text-color:#5f5c66;
  --divider-color:#e3e1e6;          --disabled-text-color:#b5b2bb;
  --primary-color:#3b6fd4;          --accent-color:#7a9b5e;
  --text-primary-color:#ffffff;     --error-color:#ffd9d6;
  --secondary-background-color:#f4f2f7;
  background:#e8e6ec; padding:16px; border-radius:24px;`;

mount(
  "Light theme · the derived now colour lands dark, not pale",
  {
    entries: mock.ordinary,
    headline: "4 September · 4 left today",
    now: "Afternoon · house quiet, doors locked",
    sources: SOURCES,
  },
  {},
  { use_ha_theme: true },
  false,
  LIGHT_THEME,
);

mount("Eight calendars · pills wrap at the foot, clock in the header", {
  entries: mock.ordinary,
  headline: "3 September · 4 left today",
  now: "Afternoon · house quiet, doors locked",
  sources: MANY_SOURCES,
  stale_message: "Soccer club calendar is not updating. Anything on it is missing from today.",
});

// A sections-view card with a fixed row count: the spine has to scroll inside
// rather than the content escaping the card's rounded corners.
mount(
  "Fixed height · 420px, as a sections grid cell",
  {
    entries: mock.busy,
    headline: "9 left today",
    now: "Afternoon · house quiet, doors locked",
    sources: SOURCES,
  },
  {},
  {},
  false,
  "height:460px",
);

// Byron's production day, 4 September: eight all-day events and one visible
// spine row. Fixed height, because the whole complaint was about a phone.
mount(
  "Eight all-day events · frame capped, tagged and actionable pulled forward",
  {
    entries: mock.manyAllDay,
    headline: "4 September · 1 left today",
    now: "Afternoon · house quiet, doors locked",
    sources: SOURCES,
  },
  {},
  {},
  false,
  "height:460px",
);

mount(
  "Eight all-day events · max_all_day raised, old behaviour intact",
  {
    entries: mock.manyAllDay,
    headline: "4 September · 1 left today",
    now: "Afternoon · house quiet, doors locked",
    sources: SOURCES,
  },
  {},
  { max_all_day: 20 },
  false,
  "height:460px",
);

// The garage case: a standing row with two buttons, and the row an automation
// pushed in with day_spine.show when the script declined to close it.
mount("Standing rows · two buttons, and a script that declined", {
  entries: mock.standing,
  headline: "4 September · 4 left today",
  now: "Afternoon · house quiet, garage open",
  sources: SOURCES,
});

mount("Empty day · sun and now marker remain", {
  entries: mock.emptyDay,
  headline: "Nothing scheduled.",
  now: "Morning · 3 lights on, 71° inside",
  sources: SOURCES,
});

mount("Stale source · says what it doesn't know", {
  entries: mock.staleSource,
  headline: "1 left today",
  now: "Morning · everyone up",
  sources: [{ label: "Google", stale: true }, { label: "CalDAV" }],
  stale_message:
    "Google calendar hasn't updated since 8:14 AM yesterday. Anything on it is missing from today.",
});

mount("Busy day · overdue actionable, recent event, overflow", {
  entries: mock.busy,
  headline: "9 left today",
  now: "Afternoon · house quiet, doors locked",
  sources: [{ label: "Google" }, { label: "CalDAV" }, { label: "Tasks" }],
});

mount("Loading · rail at full height, no dots, no collapse", {}, { unavailable: true });

mount("No all-day events · region omitted entirely", {
  entries: mock.ordinary.filter((e) => !e.all_day),
  headline: "4 left today",
  now: "Afternoon · house quiet, doors locked",
  sources: SOURCES,
});

// End to end: the actual attributes ha/day_spine.yaml produces, rendered by the
// actual card. Regenerate with scratchpad/render.py after editing the feed.
try {
  const feed = await (await fetch("./feed-sample.json")).json();
  mount("Real feed output · ha/day_spine.yaml → the card", feed);
} catch (e) {
  console.warn("feed-sample.json not found; skipping the end-to-end panel", e);
}

// The integration's own merge output, rendered by the real card. Regenerate
// with tools/render-integration.py.
try {
  const feed = await (await fetch("./integration-sample.json")).json();
  mount("Integration output · custom_components/day_spine → the card", feed);
} catch (e) {
  console.warn("integration-sample.json not found; skipping that panel", e);
}

mount("Overlaps · three things running at once, plus a day-spanning event", {
  entries: mock.overlapping,
  headline: "3 running, 3 left today",
  now: "Afternoon · house busy",
  sources: [{ label: "Google" }, { label: "CalDAV" }, { label: "House" }],
});

// A stand-in for a light Home Assistant theme, to prove the card adopts one.
// These are HA's own variable names, set the way a theme sets them.
const HA_LIGHT_THEME = `
  --card-background-color:#ffffff; --secondary-background-color:#f5f5f5;
  --primary-text-color:#212121;    --secondary-text-color:#727272;
  --divider-color:#e0e0e0;         --disabled-text-color:#bdbdbd;
  --primary-color:#03a9f4;         --accent-color:#7e57c2;
  --error-color:#fdecea;           --ha-card-border-radius:12px;`;

mount(
  "HA theme mode · use_ha_theme, light theme vars",
  {
    entries: mock.busy,
    headline: "9 left today",
    now: "Afternoon · house quiet, doors locked",
    sources: [{ label: "Google" }, { label: "CalDAV", stale: true }, { label: "Tasks" }],
    stale_message: "CalDAV calendar is not updating.",
  },
  {},
  { use_ha_theme: true },
  false,
  HA_LIGHT_THEME,
);

mount(
  "Fluid floor · 360px, legend off",
  {
    entries: mock.busy,
    headline: "9 left today",
    now: "Afternoon · house quiet",
    sources: SOURCES,
  },
  {},
  { show_legend: false },
  true,
);
</script>
</body>
</html>
