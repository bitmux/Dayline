show:
  name: Show a row
  description: >-
    Put a row on today's spine from an automation, with up to two buttons.
    Calling again with the same id replaces the row rather than adding a second
    one, so this is safe to call from an automation that runs often.
  fields:
    message:
      name: Message
      description: The line as it appears on the card. Plain words, no entity ids.
      required: true
      example: Garage did not close — someone is in the driveway
      selector:
        text:
    id:
      name: Id
      description: >-
        Your name for this row. Calling show again with the same id replaces it,
        and dismiss takes it away. Leave it empty and one is derived from the
        message.
      example: garage_open
      selector:
        text:
    level:
      name: Level
      description: >-
        Normal looks like everything else on the card. Info is quieter, for
        something worth knowing. Alert is for something wrong — it draws in red
        with a warning icon, and nothing else on this card is red.
      default: normal
      selector:
        select:
          options:
            - label: Normal
              value: normal
            - label: Information
              value: info
            - label: Alert
              value: alert
    sentence:
      name: What the house will do
      description: >-
        An optional second line, in sage, for what happens on its own. Say the
        consequence, not the scene name.
      example: Trying again when the camera is clear
      selector:
        text:
    priority:
      name: Priority
      description: >-
        High never collapses off the card, which is usually right for a row an
        automation went to the trouble of pushing.
      default: high
      selector:
        select:
          options: [high, normal, low]
    duration:
      name: Duration
      description: >-
        Seconds before the row leaves on its own. Omit it and the row stays
        until something dismisses it.
      example: 900
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    start:
      name: Start
      description: >-
        Where the row sorts into the day, as an ISO timestamp. Defaults to now.
      example: "2026-09-04T10:42:00-05:00"
      selector:
        text:
    spine:
      name: Which spine
      description: >-
        Optional. Leave empty and the row goes on every Dayline card, which is
        what you want for "the garage is open". Name one or more Dayline sensors
        to aim it at those cards only — the point of a card each is that not
        everything belongs on all of them.
      selector:
        entity:
          multiple: true
          integration: dayline
          domain: sensor
    entity_id:
      name: Related entity
      description: >-
        Optional. What the row is about, so tapping it opens the right more-info
        dialog when the card has interactive rows switched on.
      selector:
        entity:
    # Sections group fields in the editor and nothing more — the data Home
    # Assistant sends is flat, exactly as `light.turn_on` takes `brightness`
    # from inside its `additional_fields` section. So these names have to be
    # unique across the whole action, not just within their section. Called
    # `label` and `action` they collided, the UI sent one of each at the top
    # level, and every call from the editor failed schema validation.
    confirm:
      name: Confirm button
      description: >-
        The affirmative one — the thing the row is asking for. It can do anything
        a button on a dashboard can do.
      collapsed: true
      fields:
        confirm_label:
          name: Label
          description: What the button says.
          example: Close it
          selector:
            text:
        confirm_action:
          name: Action
          description: >-
            What pressing it does. Perform an action, open a more-info dialog,
            navigate, or open a URL — the same choices a button card gives you.
          selector:
            ui_action:
    cancel:
      name: Cancel button
      description: >-
        The second, quieter one — "not now". Leave it out for a row that only
        offers one thing. It can call any action too; dismissing the row is
        usually dayline.dismiss with this row's id.
      collapsed: true
      fields:
        cancel_label:
          name: Label
          description: What the button says.
          example: Leave it open
          selector:
            text:
        cancel_action:
          name: Action
          description: What pressing it does.
          selector:
            ui_action:

dismiss:
  name: Dismiss a row
  description: >-
    Take a pushed row off the spine. An id that is not there is not an error, so
    an automation tidying up after itself does not have to check first.
  fields:
    id:
      name: Id
      description: The id given to dayline.show.
      required: true
      example: garage_open
      selector:
        text:
    spine:
      name: Which spine
      description: >-
        Optional. Leave empty and the row goes on every Dayline card, which is
        what you want for "the garage is open". Name one or more Dayline sensors
        to aim it at those cards only — the point of a card each is that not
        everything belongs on all of them.
      selector:
        entity:
          multiple: true
          integration: dayline
          domain: sensor

explain:
  name: Explain what just happened
  description: >-
    Put a short sage line on the spine saying what the house just did, from
    inside the automation that did it. It sits at its own moment among the past
    rows, is never struck through and never counted among what is left today,
    and fades on its own.

    Dayline used to watch labelled entities and write this line itself. It could
    say what changed and never why, and why is the only part anyone went looking
    for — which only the automation knows.
  fields:
    message:
      name: Message
      description: What happened, in a sentence someone would say out loud.
      required: true
      example: Living room lights turned off by the motion sensor
      selector:
        text:
    sentence:
      name: Credit
      description: >-
        Optional. What did it — usually the automation's own name, so the line
        can be traced back without opening the logbook.
      example: Evening wind-down
      selector:
        text:
    duration:
      name: Fades after
      description: Seconds before the row disappears. Defaults to five minutes.
      example: 300
      selector:
        number:
          min: 30
          max: 3600
          step: 30
          unit_of_measurement: s
          mode: box
    id:
      name: Id
      description: >-
        Optional. Calling again with the same id replaces the line rather than
        stacking a second copy.
      example: lr_lights
      selector:
        text:
    start:
      name: Start
      description: >-
        When it happened, as an ISO timestamp. Defaults to now, which is almost
        always right for an explanation.
      example: "2026-09-04T10:42:00-05:00"
      selector:
        text:
    entity_id:
      name: Related entity
      description: >-
        Optional. What the line is about, so tapping it opens the right
        more-info dialog when the card has interactive rows switched on.
      selector:
        entity:
    spine:
      name: Which spine
      description: >-
        Optional. Leave empty and the line goes on every Dayline card. Name one
        or more Dayline sensors to aim it at those cards only.
      selector:
        entity:
          multiple: true
          integration: dayline
          domain: sensor
